name: Parser contribution
description: Share a statement format you got working in Zinfai
title: "Parser contribution: "
# Labels declared here are applied no matter who opens the issue. Labels passed
# as URL query parameters are not: GitHub returns a 404 to anyone without label
# permission, which is every contributor arriving from the app. The institution
# label is added afterwards by .github/workflows/label-contributions.yml.
labels: ["parser-contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Zinfai fills this in for you — **Contribute** on a working parser, then
        **Submit it**. If you are writing it by hand, the entry has to come out
        of the app: the fixture and expected rows are generated, not authored.

  - type: input
    id: institution
    attributes:
      label: Institution
      description: >-
        The bank or broker whose statements this parser reads. Used to label the
        issue, so keep it to the plain name — "HDFC Bank", not "HDFC Bank
        savings account statement PDF".
      placeholder: HDFC Bank
    validations:
      required: true

  - type: textarea
    id: entry
    attributes:
      label: Entry
      description: >-
        Generated by Zinfai: the spec, a redacted fixture, and the rows that
        fixture must produce. Do not edit it by hand — CI runs the spec against
        the fixture and compares, and hand-editing only breaks that.
      render: json
    validations:
      required: true

  - type: checkboxes
    id: reviewed
    attributes:
      label: Before you submit
      options:
        - label: >-
            I have read the redacted fixture and none of it is my data. No real
            payee, account number, amount or date survives in it.
          required: true
        - label: >-
            There is no email address, account number or other personal detail
            in the `contributor` field.
          required: true
